<!doctype html>
<!-- The macOS disk image window (540×380): Ultima on the left, Applications on the right (positions in package.json →
     build.dmg.contents). Rendered to build/background.png and background@2x.png by render.js. Finder draws the icon
     labels itself, black in Light Mode and white in Dark Mode, so the strip behind them is a mid-tone both read on. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../src/renderer/fonts/inter.css">
<style>
  html, body { margin: 0; width: 540px; height: 380px; overflow: hidden; }
  body { position: relative; font-family: 'Inter Variable', Inter, system-ui, sans-serif; color: #f1ecff;
    background: radial-gradient(120% 90% at 50% 0%, #1d1240 0%, #0b0818 55%, #05040b 100%); }
  .aurora { position: absolute; inset: -20%; filter: blur(46px); opacity: .9; }
  .aurora i { position: absolute; border-radius: 50%; }
  .aurora i:nth-child(1) { left: 2%; top: 28%; width: 58%; height: 60%; background: radial-gradient(closest-side, rgba(124, 58, 237, .55), transparent); }
  .aurora i:nth-child(2) { right: 0%; top: 30%; width: 55%; height: 58%; background: radial-gradient(closest-side, rgba(34, 211, 238, .32), transparent); }
  .aurora i:nth-child(3) { left: 30%; top: -10%; width: 50%; height: 40%; background: radial-gradient(closest-side, rgba(196, 170, 255, .28), transparent); }
  #stars { position: absolute; inset: 0; }
  header { position: absolute; top: 34px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 40px; height: 40px; filter: drop-shadow(0 0 10px rgba(196, 170, 255, .55)); }
  .brand span { font-size: 26px; font-weight: 700; letter-spacing: 7px; padding-left: 7px;
    background: linear-gradient(180deg, #fff 30%, #c9bcff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hint { font-size: 12.5px; letter-spacing: .3px; color: rgba(232, 228, 255, .7); }
  /* the arrow from the app (x 140) to Applications (x 400), at the icons' height (y 205) */
  svg.arrow { position: absolute; left: 0; top: 0; width: 540px; height: 380px; overflow: visible; }
  /* the strip behind Finder's labels (icons are centered at y 205; labels sit under them) */
  .labels { position: absolute; left: 0; right: 0; top: 252px; height: 34px;
    background: linear-gradient(90deg, transparent, rgba(118, 98, 168, .92) 18%, rgba(118, 98, 168, .92) 82%, transparent); }
  .labels::before, .labels::after { content: ""; position: absolute; left: 12%; right: 12%; height: 1px; background: rgba(255, 255, 255, .18); }
  .labels::before { top: 0; } .labels::after { bottom: 0; }
  footer { position: absolute; bottom: 22px; left: 0; right: 0; text-align: center; font-size: 11px; letter-spacing: .3px; color: rgba(232, 228, 255, .45); }
</style>
</head>
<body>
  <div class="aurora"><i></i><i></i><i></i></div>
  <canvas id="stars" width="1080" height="760"></canvas>
  <header>
    <div class="brand"><img src="../../installer/ui/emblem.png" alt=""><span>ULTIMA</span></div>
    <div class="hint">Drag Ultima into your Applications folder</div>
  </header>
  <div class="labels"></div>
  <svg class="arrow" viewBox="0 0 540 380">
    <defs>
      <linearGradient id="a" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity=".15"/><stop offset=".55" stop-color="#c4b5fd"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
      <filter id="glow" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <g fill="none" stroke="url(#a)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <path d="M212 205 C 250 190, 290 190, 326 203"/>
      <path d="M314 192 L 328 204 L 312 213"/>
    </g>
  </svg>
  <footer>Ultima Browser for Apple Silicon</footer>
  <script>
    // a fixed starfield (seeded, so every render is the same)
    const c = document.getElementById('stars'), g = c.getContext('2d');
    let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    for (let i = 0; i < 170; i++) {
      const x = rnd() * 1080, y = rnd() * 760, r = rnd() < .9 ? rnd() * 1.3 + .3 : rnd() * 2 + 1.2;
      g.globalAlpha = .25 + rnd() * .65; g.fillStyle = rnd() < .2 ? '#c9e9ff' : rnd() < .3 ? '#e0d4ff' : '#ffffff';
      g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    }
    c.style.width = '540px'; c.style.height = '380px';
  </script>
</body>
</html>
