<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: http: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Ultima</title>
  <link rel="stylesheet" href="fonts/inter.css">
  <style>
    /* The tear-off ghost (main/tearoff.js): a clear window over the screen, with the picture of the window a dragged
       tab will become. Nothing here takes the pointer. */
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    body { font: 13px/1.3 "Inter", "Segoe UI Emoji", sans-serif; -webkit-font-smoothing: antialiased; user-select: none; pointer-events: none; }
    .mover { position: absolute; left: 0; top: 0; will-change: transform; }
    .tilt, .pop { transform-origin: var(--hx) var(--hy); will-change: transform; }
    .pop { opacity: 0; }
    .card {
      position: relative; display: flex; flex-direction: column; overflow: hidden; border-radius: 12px;
      background: var(--surface); color: var(--text);
      box-shadow: 0 0 0 1px var(--edge), 0 22px 54px rgba(0, 0, 0, 0.42), 0 6px 16px rgba(0, 0, 0, 0.22);
    }
    .bar { flex: none; height: 36px; display: flex; align-items: center; padding: 0 6px; box-sizing: border-box; overflow: hidden; }
    .tab {
      display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%; height: 26px; padding: 0 10px; box-sizing: border-box; border-radius: 8px;
      background: color-mix(in srgb, var(--text) 10%, transparent); box-shadow: inset 0 -2px 0 var(--accent);
    }
    .tab img, .tab .dot { flex: none; width: 16px; height: 16px; border-radius: 4px; }
    .tab .dot { background: var(--accent); opacity: 0.8; border-radius: 50%; transform: scale(0.6); }
    .tab span { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 500; }
    .page { position: relative; flex: 1; min-height: 0; margin: 0 6px 6px; border-radius: 8px; overflow: hidden; background: color-mix(in srgb, var(--text) 6%, var(--surface)); }
    .page img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: left top; }
    .page .mark { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px; border-radius: 10px; opacity: 0.85; }
  </style>
</head>
<body>
  <div class="mover" id="mover" hidden>
    <div class="tilt" id="tilt">
      <div class="pop" id="pop">
        <div class="card" id="card">
          <div class="bar"><div class="tab" id="tab"></div></div>
          <div class="page" id="page"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="tearoff.js"></script>
</body>
</html>
